[package]
name = "sieve-cache"
version = "1.2.0"
edition = "2021"
description = "In-memory cache using SIEVE eviction, with concurrent, thread-safe, sharded, and weighted cache variants"
homepage = "https://github.com/jedisct1/rust-sieve-cache"
repository = "https://github.com/jedisct1/rust-sieve-cache"
documentation = "https://docs.rs/sieve-cache"
keywords = ["cache", "caching", "sieve", "concurrent", "weighted"]
license = "MIT"
authors = ["Frank Denis <github@pureftpd.org>"]
categories = ["algorithms", "caching", "concurrency", "data-structures"]
readme = "README.md"
rust-version = "1.60.0"

[features]
default = ["sync", "sharded", "weighted"]
sync = []
sharded = []
weighted = []
doctest = ["sync", "sharded", "weighted"]

[dependencies]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8.8"
rand_distr = "0.4.3"

[[bench]]
name = "criterion"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
opt-level = 3
debug = true
lto = "thin"
